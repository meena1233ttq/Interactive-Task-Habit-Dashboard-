<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaStudio — Interactive Digital Storefront</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">NovaStudio</div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">🌙 Dark</button>
      <button class="cart-btn" id="openCart">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <section class="hero">
    <h1>Modern Responsive Digital Assets</h1>
    <p>Explore interactive templates, UI kits, and productivity tools built with clean HTML, CSS, and JavaScript.</p>
  </section>

  <section class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Search templates, UI kits, planners..." />
    <div class="filters" id="filterGroup">
      <button class="filter-btn active" data-cat="All">All</button>
      <button class="filter-btn" data-cat="Templates">Templates</button>
      <button class="filter-btn" data-cat="UI Kits">UI Kits</button>
      <button class="filter-btn" data-cat="Productivity">Productivity</button>
    </div>
  </section>

  <main class="grid" id="productGrid"></main>

  <!-- Quick Preview Modal -->
  <div class="overlay" id="modalOverlay">
    <div class="modal">
      <span class="badge" id="modalCat">Category</span>
      <h2 id="modalTitle">Title</h2>
      <p id="modalDesc" class="modal-desc">Description</p>
      <p id="modalPrice" class="modal-price">$0</p>
      <div class="modal-actions">
        <button class="btn-outline" id="closeModal">Close</button>
        <button class="btn-add" id="modalAddBtn">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Slide-out Cart Drawer -->
  <aside class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3>Your Cart</h3>
      <button class="icon-btn" id="closeCart">✕</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="drawer-footer">
      <div class="cart-total-row">
        <span>Total</span>
        <span id="cartTotal">$0</span>
      </div>
      <button class="cart-btn checkout-btn" id="checkoutBtn">Simulate Checkout</button>
    </div>
  </aside>

  <div class="toast" id="toast">Added to cart!</div>

  <script src="script.js"></script>
</body>
</html>
